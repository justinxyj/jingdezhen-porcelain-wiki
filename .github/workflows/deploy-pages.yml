name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Generate canonical Entry pages
        run: python scripts/generate_entry_pages.py

      - name: Build site
        run: mkdocs build --strict

      - name: Check built internal links before publishing
        run: python scripts/check_built_links.py site

      - name: Verify all 250 shared Headers before publishing
        run: python scripts/check_shared_header.py site

      - name: Install Header browser regression dependencies
        run: |
          pip install playwright Pillow
          python -m playwright install --with-deps chromium

      - name: Shared Header visual and keyboard regression before publishing
        run: python scripts/test_shared_header_browser.py

      - name: Verify authoritative Entry DOM across all 250 pages
        run: python scripts/test_entry_render_stability.py

      - name: Upload Entry stability stages and DOM measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-render-stability
          path: /tmp/entry-render-stability/

      - name: Upload Header comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-header-release-gate
          path: /tmp/shared-header-browser/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup Python for browser smoke
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: pip install playwright Pillow

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Smoke test deployed Pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/pages_smoke.py

      - name: Verify deployed shared Header interactions
        env:
          HEADER_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/test_shared_header_browser.py

      - name: Verify published Entry render stability
        env:
          ENTRY_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/test_entry_render_stability.py

      - name: Upload production Entry stages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-render-stability-production
          path: /tmp/entry-render-stability/

      - name: Upload production Header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-header-production
          path: /tmp/shared-header-browser/

      - name: Post-deploy Supabase ACL smoke
        run: python scripts/runtime_smoke.py --check acl
