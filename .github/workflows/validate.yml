name: Validate Museum Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Run museum QA
        run: python scripts/museum_qa.py

      - name: Supabase smoke — published entries
        run: python scripts/runtime_smoke.py --check entries

      - name: Supabase smoke — public media
        run: python scripts/runtime_smoke.py --check media

      - name: Supabase smoke — 72 craft processes
        run: python scripts/runtime_smoke.py --check craft

      - name: Supabase smoke — sensitive tables
        run: python scripts/runtime_smoke.py --check sensitive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install type-check dependencies
        run: npm install --no-package-lock

      - name: Type check core JavaScript
        run: npm run typecheck

      - name: Build site
        run: mkdocs build --strict
