name: Validate Museum Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Run museum QA
        run: python scripts/museum_qa.py

      - name: Run security static smoke
        run: python scripts/security_static_smoke.py

      # Production Supabase smoke is a post-deploy check; PR validation must not depend on live production data.
      - name: Supabase smoke — public ACL (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/runtime_smoke.py --check acl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install type-check dependencies
        run: npm install --no-package-lock

      - name: Type check database contracts
        run: npm run typecheck

      - name: Build site
        run: mkdocs build --strict
