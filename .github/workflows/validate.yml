name: Validate Museum Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Run museum QA
        run: python scripts/museum_qa.py

      # L0 includes H-3 catalog file presence + dangerous GRANT EXECUTE is_staff→anon scan
      - name: Run security static smoke
        run: python scripts/security_static_smoke.py

      # Production Supabase smoke is a post-deploy check; PR validation must not depend on live production data.
      - name: Supabase smoke — public ACL (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/runtime_smoke.py --check acl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install type-check dependencies
        run: npm ci

      - name: Type check database contracts
        run: npm run typecheck

      - name: Search discovery and image recovery
        run: |
          node scripts/test_search_discovery.mjs
          node scripts/test_museum_image_recovery.mjs
          node scripts/test_catalog_people_metadata.mjs

      - name: Source disclosure consistency
        run: |
          python scripts/test_sources_render.py --require-dynamic
          node scripts/test_evidence_disclosure.mjs
          node scripts/test_body_sanitizer.mjs

      - name: Editorial release safety boundaries
        run: |
          python scripts/test_editorial_release.py
          python scripts/test_entry_sanitizer.py

      - name: Build site
        run: mkdocs build --strict
