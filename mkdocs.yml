site_name: 景德镇陶瓷数字博物馆 · Jingdezhen Porcelain Wiki
site_description: 景德镇陶瓷历史、工艺、器物、窑址、人物与当代文化数字博物馆
site_url: https://justinxyj.github.io/jingdezhen-porcelain-wiki/
repo_url: https://github.com/justinxyj/jingdezhen-porcelain-wiki
repo_name: justinxyj/jingdezhen-porcelain-wiki

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - stylesheets/museum.css
  - stylesheets/wiki.css
  - stylesheets/timeline-comparison.css
  - stylesheets/timeline-interactive.css
  - stylesheets/museum-images.css
  - stylesheets/official-gallery.css
  - stylesheets/site-interactions.css
  - stylesheets/evidence-hub.css
  - stylesheets/global-kiln-map.css
  - stylesheets/homepage-apple.css
extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - javascripts/runtime-config.js
  - https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
  - javascripts/media-policy.js
  - javascripts/knowledge-store.js
  - javascripts/museum.js
  - javascripts/wiki-enhancements.js
  - javascripts/wiki-timeline.js
  - javascripts/timeline-interactive.js
  - javascripts/voices-books.js
  - javascripts/evidence-hub.js
  - javascripts/literature-library.js
  - javascripts/global-kiln-map.js
  - javascripts/museum-images.js
  - javascripts/homepage-apple.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 数字博物馆:
      - 博物馆总览: museum/index.md
      - 历史时间轴: museum/timeline.md
      - 窑址地图: museum/kiln-map.md
      - 器物图谱: museum/catalog.md
      - 人物数据库: museum/people.md
      - 名人与书籍评价: museum/voices-and-books.md
      - 图片库: museum/gallery.md
      - 知识条目: entry.md
  - 文献研究:
      - 研究规范: research/README.md
      - 核心文献库: research/sources.md
      - 文献总库: research/literature-library.md
      - 考古资料与时间轴: research/archaeology.md
      - 研究导览: research/research-hub.md
      - 世界遗产: research/heritage.md
      - 补充文献库: research/sources-addendum.md
  - 历史与发展:
      - 历史总览: history/README.md
      - 唐五代: history/tang-wudai.md
      - 宋元: history/song-yuan.md
      - 明清: history/ming-qing.md
      - 近现代: history/modern.md
  - 工艺与技术:
      - 工艺总览: craft/README.md
      - 原料与配方: craft/raw-materials.md
      - 成型与修整: craft/forming-and-finishing.md
      - 窑炉与烧成: craft/kiln-firing.md
      - 青花: craft/qinghua.md
      - 粉彩: craft/fencai.md
      - 颜色釉: craft/colored-glaze.md
  - 器物与美学:
      - 器物分类: objects/README.md
      - 纹饰与题材: aesthetics/patterns.md
  - 窑址与城市空间:
      - 窑址总览: kilns/README.md
      - 御窑厂: kilns/imperial-kiln.md
      - 湖田窑: kilns/hutian-kiln.md
      - 其他窑址与矿料: kilns/other-sites.md
  - 人物与传承:
      - 人物总览: people/README.md
  - 现代景德镇:
      - 现代总览: contemporary/README.md
      - 教育与研究: contemporary/education.md
      - 产业与社会: contemporary/industry.md
      - 当代艺术: contemporary/art.md
      - 世界遗产与保护: contemporary/heritage.md
      - 数字化与未来: contemporary/future.md
